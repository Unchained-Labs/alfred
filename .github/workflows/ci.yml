name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 requires Node >= 22, so 20 is not supportable.
        node: ["22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: format
        run: npm run format:check
      - name: build
        run: npm run build
      # The exercise runner is spawned as a child process and imports pyodide
      # at runtime, so neither typecheck nor build can tell whether it works.
      # This boots a real interpreter and checks a real assertion.
      # The handbook renderer turns provider output into a page the user opens,
      # so what matters is that markdown becomes the right elements and that
      # nothing from the content lands as markup. Deterministic and offline.
      - name: handbook renders and escapes its content
        run: npm run check:handbook
      # The discovery filter and the per-source field mapping, offline against
      # payloads recorded from the live APIs. The mapping matters because a
      # wrong field produces a source that answers happily and yields nothing.
      - name: discovery filters and maps its sources
        run: npm run check:discovery
      # Every figure on the Analytics page is derived, and a wrong derived
      # number renders exactly as confidently as a right one. "You lose most
      # often at the technical round" changes what someone practises for a
      # month, so the stage attribution, the censoring of in-flight waits and
      # the suppression of rates over tiny samples are gated here against a
      # fixture whose answers were worked out by hand.
      - name: analytics aggregations are correct
        run: npm run check:analytics
      - name: exercise runner executes python
        run: |
          node -e "process.stdout.write(JSON.stringify({code:'def ok():\n    return 1\n',tests:[{name:'boots',call:'ok()',expect:'1',hidden:false},{name:'compares',call:'ok() + 1',expect:'3',hidden:true}]}))" > /tmp/job.json
          node runner/python-runner.mjs < /tmp/job.json | tee /tmp/out.ndjson
          grep -q '"index":0,"passed":true' /tmp/out.ndjson
          grep -q '"index":1,"passed":false' /tmp/out.ndjson

  migrations:
    name: migrations are committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: schema applies from scratch
        run: npm run migrate
      - name: no uncommitted migration for the current schema
        run: |
          npm run db:generate
          if ! git diff --quiet -- drizzle; then
            echo "::error::src/db/schema.ts changed without a committed migration. Run 'npm run db:generate' and commit drizzle/."
            git --no-pager diff --stat -- drizzle
            exit 1
          fi

  smoke:
    name: app boots and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: signed out, then signed in, behaves as documented
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/setup && break; sleep 1; done
          fail=0
          check() { # check <label> <expected> <actual>
            printf '%-42s %s' "$1" "$3"
            if [ "$3" = "$2" ]; then echo "  ok"; else echo "  EXPECTED $2"; fail=1; fi
          }

          # --- signed out -------------------------------------------------
          check "GET /            (redirect to login)" 307 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)"
          # Before anyone exists, /login sends you to /setup — there is nobody to sign in as.
          check "GET /login       (-> /setup, no accounts)" 307 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)"
          check "GET /setup       (no accounts yet)" 200 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/setup)"
          check "GET /api/applications (no session)" 401 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/applications)"

          # --- create the owner -------------------------------------------
          check "POST /api/auth/setup" 201 \
            "$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/ck.txt -X POST http://localhost:3000/api/auth/setup \
               -H 'content-type: application/json' \
               -d '{"email":"ci@example.com","name":"CI","password":"a-long-enough-password"}')"
          check "POST /api/auth/setup (second time)" 400 \
            "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/setup \
               -H 'content-type: application/json' \
               -d '{"email":"other@example.com","name":"X","password":"a-long-enough-password"}')"

          # --- signed out again, now that an account exists -----------------
          check "GET /login       (serves once set up)" 200 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)"
          check "GET /setup       (-> /login, closed)" 307 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/setup)"

          # --- signed in ---------------------------------------------------
          for path in / /pipeline /jobs /jobs/discover /prep /calendar /inbox /analytics /settings; do
            check "GET $path (signed in)" 200 \
              "$(curl -s -o /dev/null -b /tmp/ck.txt -w '%{http_code}' "http://localhost:3000$path")"
          done
          check "GET /nope        (unknown route)" 404 \
            "$(curl -s -o /dev/null -b /tmp/ck.txt -w '%{http_code}' http://localhost:3000/nope)"
          # With no provider configured, AI routes refuse cleanly rather than 500.
          check "POST /api/ai/test (unconfigured)" 409 \
            "$(curl -s -o /dev/null -b /tmp/ck.txt -w '%{http_code}' -X POST http://localhost:3000/api/ai/test \
               -H 'content-type: application/json' -d '{"provider":"agent","config":{"endpoint":""}}')"

          # --- exercises: completion is earned, not asserted ----------------
          app=$(curl -s -b /tmp/ck.txt -X POST http://localhost:3000/api/applications \
                  -H 'content-type: application/json' \
                  -d '{"company":"Acme","title":"Backend Engineer"}' | jq -r .application.id)
          gated=$(curl -s -b /tmp/ck.txt -X POST http://localhost:3000/api/actionables \
                  -H 'content-type: application/json' \
                  -d "{\"applicationId\":\"$app\",\"kind\":\"leetcode\",\"title\":\"Two sum\"}" | jq -r .actionable.id)
          open=$(curl -s -b /tmp/ck.txt -X POST http://localhost:3000/api/actionables \
                  -H 'content-type: application/json' \
                  -d "{\"applicationId\":\"$app\",\"kind\":\"research\",\"title\":\"Read the engineering blog\"}" | jq -r .actionable.id)
          patch() { # patch <id> <json>
            curl -s -o /dev/null -b /tmp/ck.txt -w '%{http_code}' \
              -X PATCH "http://localhost:3000/api/actionables/$1" \
              -H 'content-type: application/json' -d "$2"
          }
          # A coding item has an exercise behind it, so done must be refused —
          # both on its own and smuggled inside a wider patch.
          check "PATCH coding -> done   (not earned)" 409 "$(patch "$gated" '{"status":"done"}')"
          check "PATCH coding -> done   (in a patch)" 409 "$(patch "$gated" '{"title":"Two sum","status":"done"}')"
          check "PATCH coding -> in_progress" 200 "$(patch "$gated" '{"status":"in_progress"}')"
          check "PATCH coding -> skipped" 200 "$(patch "$gated" '{"status":"skipped"}')"
          # Research has nothing to check, so it completes the ordinary way.
          check "PATCH research -> done (ungated)" 200 "$(patch "$open" '{"status":"done"}')"
          check "GET /prep/<item> (workspace)" 200 \
            "$(curl -s -o /dev/null -b /tmp/ck.txt -w '%{http_code}' "http://localhost:3000/prep/$gated")"
          check "POST /api/exercises/x/run (unknown)" 404 \
            "$(curl -s -o /dev/null -b /tmp/ck.txt -w '%{http_code}' -X POST \
               http://localhost:3000/api/exercises/does-not-exist/run \
               -H 'content-type: application/json' -d '{"code":"x=1"}')"

          # --- analytics: renders from real rows, not just the empty state ---
          # The aggregations are asserted offline by check:analytics. What this
          # adds is that the page survives contact with a real database: one
          # application, one stage move, one closure with feedback, and every
          # panel still renders. A chart that throws on n=1 would otherwise
          # only be found by the first person to open the page.
          curl -s -o /dev/null -b /tmp/ck.txt -X PATCH "http://localhost:3000/api/applications/$app/move" \
            -H 'content-type: application/json' -d '{"stage":"screening"}'
          # React separates adjacent text nodes with an empty HTML comment, so
          # JSX written as `out at {label}` reaches the browser as
          # "out at <!-- -->screening". Strip comments before matching rather
          # than contorting components to suit a grep.
          page() { curl -s -b /tmp/ck.txt http://localhost:3000/analytics | sed 's/<!--[^>]*-->//g'; }
          body=$(page)
          for phrase in "Where applications end" "Time in each stage" "Time to first reply" \
                        "Sends and outcomes by week" "Fit score against how far it went" \
                        "Response rate by slice" "What they said"; do
            printf '%-42s' "analytics panel: $phrase"
            if printf '%s' "$body" | grep -qF "$phrase"; then echo "  ok"; else echo "  MISSING"; fail=1; fi
          done
          printf '%-42s' "analytics is past the empty state"
          if printf '%s' "$body" | grep -qF "Nothing to measure yet"; then echo "  STILL EMPTY"; fail=1; else echo "  ok"; fi

          # Closing with feedback must surface in the rejection panel.
          curl -s -o /dev/null -b /tmp/ck.txt -X POST "http://localhost:3000/api/applications/$app/close" \
            -H 'content-type: application/json' \
            -d '{"stage":"rejected","outcomeNote":"Needed deeper Kafka experience.","clearTasks":true}'
          body=$(page)
          printf '%-42s' "analytics shows the rejection feedback"
          if printf '%s' "$body" | grep -qF "Needed deeper Kafka experience."; then echo "  ok"; else echo "  MISSING"; fail=1; fi
          printf '%-42s' "and attributes it to the screening round"
          if printf '%s' "$body" | grep -qF "out at screening"; then echo "  ok"; else echo "  MISSING"; fail=1; fi

          exit $fail

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: build docs (strict — broken links fail)
        run: mkdocs build --strict
